name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned deliberately: the project is built and verified against this
          # exact version. Bump it here and in docs/handbook/01-getting-started.md
          # together.
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - run: flutter pub get

      # No secrets and no --dart-define: analysis and tests must pass on a
      # clean checkout, which is what a new contributor gets.
      - name: Analyze
        run: flutter analyze

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Test
        run: flutter test
